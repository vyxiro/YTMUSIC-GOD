name: Build Unified YTMusicUltimate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Optional URL to Decrypted YouTube Music .ipa for Direct Injection"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unified-tweak:
    name: Compile Unified YTMusicUltimate Dylib and Deb
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install make ldid dpkg

      - name: Set Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos & SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            theos
          key: theos-macos-16.5-sdk-v1

      - name: Setup Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iPhoneOS 16.5 SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk "$THEOS/sdks"
          cd .. && rm -rf sdks

      - name: Compile Unified YTMusicUltimate
        run: |
          make clean package FINALPACKAGE=1 DEBUG=0 SIDELOADING=1 SUBSTRATE=0
          
          mkdir -p dist
          find .theos/ -name "*.dylib" -exec cp {} dist/YTMusicUltimate.dylib \;
          cp packages/*.deb dist/

          # Universal Sideloading RPATH Fix:
          install_name_tool -change /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate @rpath/CydiaSubstrate.framework/CydiaSubstrate dist/YTMusicUltimate.dylib || true
          install_name_tool -add_rpath @executable_path/Frameworks dist/YTMusicUltimate.dylib || true
          install_name_tool -add_rpath @loader_path/Frameworks dist/YTMusicUltimate.dylib || true
          install_name_tool -add_rpath @loader_path dist/YTMusicUltimate.dylib || true
          ldid -S dist/YTMusicUltimate.dylib || true

          echo "Successfully patched and verified unified YTMusicUltimate:"
          otool -L dist/YTMusicUltimate.dylib
          ls -lah dist

      - name: Upload Unified Dylib Artifact (For Sideloadly)
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicUltimate-Unified-Dylib
          path: dist/YTMusicUltimate.dylib
          if-no-files-found: error

      - name: Upload Unified Deb Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicUltimate-Unified-Deb
          path: dist/*.deb
          if-no-files-found: error

  optional-inject-ipa:
    name: Inject into IPA (if URL provided)
    needs: build-unified-tweak
    runs-on: macos-latest
    if: inputs.ipa_url != ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Dylib Artifact
        uses: actions/download-artifact@v4
        with:
          name: YTMusicUltimate-Unified-Dylib
          path: ./dist

      - name: Install Cyan Injection Tool
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download Target IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O target.ipa

      - name: Inject Unified Dylib into Clean IPA
        run: |
          cyan -i target.ipa -o YouTubeMusic_Complete.ipa -u dist/YTMusicUltimate.dylib -n "YouTube Music"

      - name: Upload Complete Pre-Patched IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeMusic_Complete_IPA
          path: YouTubeMusic_Complete.ipa
